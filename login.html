<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ateliê LM Criações</title>

    <link rel="stylesheet" href="login-style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="login-container" id="loginContainer">

        <div class="login-card">

            <img src="https://i.imgur.com/DnPA7DT.png" alt="Logo" class="logo">

            <h1>Bem-vindo</h1>

            <p>
                Faça login para acessar sua conta.
            </p>

            <form id="loginForm">

                <div class="input-box">

                    <i class="bi bi-envelope-fill"></i>

                    <input type="email" id="email" placeholder="Seu e-mail" required>

                </div>

                <div class="input-box">

                    <i class="bi bi-lock-fill"></i>

                    <input type="password" id="senha" placeholder="Sua senha" required>

                </div>

                <button type="submit">
                    Entrar
                </button>

                <div class="divider">
                    <span>ou continue com</span>
                </div>

                <div class="social-login">

                    <a href="#" class="social-btn instagram">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="#" class="social-btn google">
                        <i class="bi bi-google"></i>
                    </a>

                    <a href="#" class="social-btn facebook">
                        <i class="bi bi-facebook"></i>
                    </a>

                </div>

            </form>

            <div class="links">

                <a href="esqueci-senha.html">

                    Esqueceu sua senha?

                </a>

                <a href="cadastro.html">

                    Criar conta

                </a>

            </div>

            <br>

            <a href="index.html" class="voltar-link">

                <i class="bi bi-arrow-left"></i>

                Voltar para a página inicial

        </div>

    </div>

    <div class="video-stage hidden" id="videoStage" aria-live="polite">
        <video id="loginVideo" autoplay muted playsinline>
            <source src="./video - logo/Animated_brand_logo_reveal_202608181915.mp4" type="video/mp4">
            Seu navegador não suporta vídeo HTML5.
        </video>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginContainer = document.getElementById('loginContainer');
        const videoStage = document.getElementById('videoStage');
        const loginVideo = document.getElementById('loginVideo');

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            if (!loginForm.checkValidity()) {
                loginForm.reportValidity();
                return;
            }

            loginContainer.classList.add('hidden');
            videoStage.classList.remove('hidden');
            loginVideo.currentTime = 0;

            loginVideo.play().catch(function () {
                videoStage.classList.add('hidden');
                loginContainer.classList.remove('hidden');
            });
        });

        loginVideo.addEventListener('ended', function () {
            window.location.href = 'index.html';
        });

        loginVideo.addEventListener('error', function () {
            console.error('Erro ao carregar o vídeo de login.');
            videoStage.classList.add('hidden');
            loginContainer.classList.remove('hidden');
        });
    </script>

</body>

</html>
